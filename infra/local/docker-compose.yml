services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: irespond
      POSTGRES_USER: irespond
      POSTGRES_PASSWORD: irespond-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irespond -d irespond"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - irespond-postgres:/var/lib/postgresql/data
      - ../../services/api/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  irespond-postgres:
