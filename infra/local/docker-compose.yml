services:
  yugabytedb:
    image: yugabytedb/yugabyte:2026.1.1.1-b2
    command:
      - bin/yugabyted
      - start
      - --base_dir=/home/yugabyte/yb_data
      - --background=false
    ports:
      - "5433:5433"
      - "7000:7000"
      - "15433:15433"
    healthcheck:
      test: ["CMD-SHELL", "/home/yugabyte/bin/ysqlsh --host $$(hostname) -U yugabyte -d yugabyte -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - irespond-yugabyte:/home/yugabyte/yb_data

volumes:
  irespond-yugabyte:
