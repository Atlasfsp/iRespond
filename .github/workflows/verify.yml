name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm mobile:typecheck

  api:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: irespond_test
          POSTGRES_USER: irespond
          POSTGRES_PASSWORD: irespond
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U irespond -d irespond_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://irespond:irespond@localhost:5432/irespond_test?sslmode=disable
      TEST_OBJECT_STORAGE_ENDPOINT: localhost:9000
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Start S3-compatible evidence storage
        working-directory: .
        run: |
          docker run -d --name irespond-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=irespond \
            -e MINIO_ROOT_PASSWORD=irespond-secret \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs irespond-minio
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: services/api/go.mod
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
