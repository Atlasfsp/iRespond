name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:typecheck
      - name: Repository metrics
        run: bash tools/repo_metrics.sh

  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository security boundary
        run: bash tools/security_boundary.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen JavaScript install
        run: pnpm install --frozen-lockfile
      - name: Production JavaScript vulnerability audit
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: services/api/go.sum
      - name: Verify Go module checksums
        working-directory: services/api
        run: go mod verify
      - name: Install official Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Go vulnerability scan
        working-directory: services/api
        run: '$(go env GOPATH)/bin/govulncheck ./...'
      - name: Build dependency inventory
        run: bash tools/dependency_inventory.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: build/evidence/dependencies
          if-no-files-found: error
          retention-days: 30

  api:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://yugabyte@localhost:5433/yugabyte?sslmode=disable
      TEST_OBJECT_STORAGE_ENDPOINT: localhost:9000
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Start YugabyteDB
        working-directory: .
        run: |
          docker run -d --name irespond-yugabyte --hostname irespond-yugabyte \
            -p 5433:5433 -p 7000:7000 -p 15433:15433 \
            yugabytedb/yugabyte:2026.1.1.1-b2 bin/yugabyted start \
            --base_dir=/home/yugabyte/yb_data --background=false
          for i in {1..90}; do
            if docker exec irespond-yugabyte bash -c '/home/yugabyte/bin/ysqlsh --host $(hostname) -U yugabyte -d yugabyte -c "SELECT 1"' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs irespond-yugabyte
          exit 1
      - name: Start S3-compatible evidence storage
        working-directory: .
        run: |
          docker run -d --name irespond-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=irespond \
            -e MINIO_ROOT_PASSWORD=irespond-secret \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs irespond-minio
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: services/api/go.sum
      - name: Verify tidy Go module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -p 1 ./...
      - run: go vet ./...
      - name: Verify migration command
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: Build production image
        working-directory: .
        run: docker build -f services/api/Dockerfile -t irespond-api:verify services/api

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: helm lint deploy/helm/irespond
      - run: >-
          helm template irespond deploy/helm/irespond
          --set image.repository=example.invalid/irespond-api
          --set image.tag=verify
          > /tmp/irespond-rendered.yaml
      - run: test -s /tmp/irespond-rendered.yaml
