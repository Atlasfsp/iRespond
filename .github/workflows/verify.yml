name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:typecheck
      - name: Repository metrics
        run: bash tools/repo_metrics.sh

  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Repository security boundary
        run: bash tools/security_boundary.sh
      - name: CI runtime dependency pinning
        run: bash tools/verify_ci_runtime_pins.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.4
      - name: Frozen JavaScript install
        run: pnpm install --frozen-lockfile
      - name: Production JavaScript vulnerability audit
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: services/api/go.sum
      - name: Verify Go module checksums
        working-directory: services/api
        run: go mod verify
      - name: Install official Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Go vulnerability scan
        working-directory: services/api
        run: '$(go env GOPATH)/bin/govulncheck ./...'
      - name: Build dependency inventory
        run: bash tools/dependency_inventory.sh
      - name: Build release provenance evidence
        run: bash tools/release_evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: |
            build/evidence/dependencies
            build/evidence/release
          if-no-files-found: error
          retention-days: 30

  api:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://yugabyte@localhost:5433/yugabyte?sslmode=disable
      TEST_OBJECT_STORAGE_ENDPOINT: localhost:9000
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start YugabyteDB
        working-directory: .
        run: |
          docker run -d --name irespond-yugabyte --hostname irespond-yugabyte \
            -p 5433:5433 -p 7000:7000 -p 15433:15433 \
            yugabytedb/yugabyte@sha256:3926eedf0ff4b99426fbff533128ff16635ed5697a5cf086dde4fafec28e6f75 bin/yugabyted start \
            --base_dir=/home/yugabyte/yb_data --background=false
          for i in {1..90}; do
            if docker exec irespond-yugabyte bash -c '/home/yugabyte/bin/ysqlsh --host $(hostname) -U yugabyte -d yugabyte -c "SELECT 1"' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs irespond-yugabyte
          exit 1
      - name: Start S3-compatible evidence storage
        working-directory: .
        run: |
          docker run -d --name irespond-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=irespond \
            -e MINIO_ROOT_PASSWORD=irespond-secret \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs irespond-minio
          exit 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: services/api/go.sum
      - name: Verify tidy Go module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -p 1 ./...
      - run: go vet ./...
      - name: Verify migration command
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: Verify YugabyteDB backup and restore
        working-directory: .
        run: bash tools/verify_yugabyte_backup_restore.sh
      - name: Build production image
        working-directory: .
        run: docker build -f services/api/Dockerfile -t irespond-api:verify services/api

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.4
      - run: helm lint deploy/helm/irespond
      - run: >-
          helm template irespond deploy/helm/irespond
          --set image.repository=example.invalid/irespond-api
          --set image.tag=verify
          > /tmp/irespond-rendered.yaml
      - run: test -s /tmp/irespond-rendered.yaml
      - name: Verify rollout safety contract
        run: bash tools/verify_deployment.sh /tmp/irespond-rendered.yaml
