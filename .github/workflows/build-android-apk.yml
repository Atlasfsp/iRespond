name: build-android-apk

on:
  push:
    branches:
      - build/android-apk-20260828
  pull_request:
    branches:
      - feature/stitch-unified-role-ui

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Configure Expo pnpm autolinking hoists
        run: |
          cat > .npmrc <<'EOF'
          public-hoist-pattern[]=*expo-modules-autolinking
          public-hoist-pattern[]=*expo-modules-core
          public-hoist-pattern[]=*babel-preset-expo
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install canonical workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Align native dependencies to installed Expo SDK
        working-directory: apps/mobile
        run: pnpm exec expo install --fix --pnpm

      - name: Pin Metro-compatible image-size API
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides['image-size'] = '1.0.2';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
          pnpm why image-size --recursive || true

      - name: Verify Expo, Metro and Android autolinking contracts
        run: |
          cd apps/mobile
          pnpm exec expo install --check --pnpm
          pnpm exec expo-modules-autolinking react-native-config --platform android > /tmp/irespond-rn-config.json
          cat /tmp/irespond-rn-config.json
          if grep -Fq 'expo.core.ExpoModulesPackage' /tmp/irespond-rn-config.json; then
            echo 'Legacy expo.core.ExpoModulesPackage autolink detected' >&2
            exit 1
          fi
          grep -Fq 'expo.modules.ExpoModulesPackage' /tmp/irespond-rn-config.json
          cd ../..
          METRO_DIR="$(find node_modules/.pnpm -path '*/metro@0.82.5/node_modules/metro' -type d | head -n 1)"
          test -n "$METRO_DIR"
          node - "$METRO_DIR" <<'NODE'
          const path = require('path');
          const { createRequire } = require('module');
          const metroDir = process.argv[2];
          const metroRequire = createRequire(path.join(process.cwd(), metroDir, 'package.json'));
          const imageSize = metroRequire('image-size');
          const imageSizePkg = metroRequire('image-size/package.json');
          console.log(`Metro image-size ${imageSizePkg.version}; typeof require(image-size)=${typeof imageSize}`);
          if (imageSizePkg.version !== '1.0.2' || typeof imageSize !== 'function') {
            throw new Error('Metro image-size CommonJS contract is not compatible');
          }
          NODE

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Bundle Android assets smoke test
        working-directory: apps/mobile
        run: |
          rm -rf .apk-export-smoke
          pnpm exec expo export --platform android --output-dir .apk-export-smoke
          test -d .apk-export-smoke
          rm -rf .apk-export-smoke

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/iRespond-0.1.0-stitch-test.apk
          sha256sum dist/iRespond-0.1.0-stitch-test.apk | tee dist/iRespond-0.1.0-stitch-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iRespond-android-apk
          path: |
            dist/iRespond-0.1.0-stitch-test.apk
            dist/iRespond-0.1.0-stitch-test.apk.sha256
          if-no-files-found: error
          retention-days: 7
