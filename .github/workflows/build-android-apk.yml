name: build-android-apk

on:
  push:
    branches:
      - build/android-apk-20260828
  pull_request:
    branches:
      - feature/stitch-unified-role-ui

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install canonical workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Align native dependencies to installed Expo SDK
        working-directory: apps/mobile
        run: |
          pnpm exec expo install --fix --pnpm
          pnpm exec expo install --check --pnpm
          git diff -- package.json ../../pnpm-lock.yaml || true

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/iRespond-0.1.0-stitch-test.apk
          sha256sum dist/iRespond-0.1.0-stitch-test.apk | tee dist/iRespond-0.1.0-stitch-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iRespond-android-apk
          path: |
            dist/iRespond-0.1.0-stitch-test.apk
            dist/iRespond-0.1.0-stitch-test.apk.sha256
          if-no-files-found: error
          retention-days: 7
