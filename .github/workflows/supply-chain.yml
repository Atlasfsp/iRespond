name: supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen JavaScript install
        run: pnpm install --frozen-lockfile
      - name: Production JavaScript vulnerability audit
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: services/api/go.sum
      - name: Verify Go module checksums
        working-directory: services/api
        run: go mod verify
      - name: Install official Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Go vulnerability scan
        working-directory: services/api
        run: "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build dependency inventory
        run: bash tools/dependency_inventory.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: build/evidence/dependencies
          if-no-files-found: error
          retention-days: 30
