name: docs-baseline-ownership

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to verify after bot publication
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  baseline-ownership:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve authoritative pull request metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = "pull_request_target"; then
            pr_number="$EVENT_PR_NUMBER"
          else
            pr_number="$INPUT_PR_NUMBER"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          base_sha=$(jq -r '.base.sha' <<< "$pr_json")
          base_ref=$(jq -r '.base.ref' <<< "$pr_json")
          base_repository=$(jq -r '.base.repo.full_name' <<< "$pr_json")
          head_sha=$(jq -r '.head.sha' <<< "$pr_json")
          head_ref=$(jq -r '.head.ref' <<< "$pr_json")
          head_repository=$(jq -r '.head.repo.full_name' <<< "$pr_json")
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          publication_provenance=false
          if [[ "$head_ref" =~ ^docs-sync/([0-9a-f]{40})-([1-9][0-9]*)-([0-9a-f]{40})$ ]]; then
            source_sha=${BASH_REMATCH[1]}
            publication_run_id=${BASH_REMATCH[2]}
            publication_sha=${BASH_REMATCH[3]}
            if test "$publication_sha" = "$head_sha"; then
              if run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${publication_run_id}" 2>/dev/null); then
                if jq -e \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --arg source_sha "$source_sha" \
                  '.repository.full_name == $repository
                    and .path == ".github/workflows/docs-interface-sync.yml"
                    and .event == "push"
                    and .head_branch == "main"
                    and .head_sha == $source_sha
                    and ((.status == "in_progress" and .conclusion == null)
                      or (.status == "completed" and .conclusion == "success"))' \
                  <<< "$run_json" >/dev/null; then
                  provenance_dir=$(mktemp -d)
                  if gh run download "$publication_run_id" \
                    --repo "$GITHUB_REPOSITORY" \
                    --name "documentation-publication-provenance-${publication_run_id}" \
                    --dir "$provenance_dir" >/dev/null 2>&1; then
                    if jq -e \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --arg workflow_path ".github/workflows/docs-interface-sync.yml" \
                      --arg source_sha "$source_sha" \
                      --arg base_sha "$base_sha" \
                      --arg run_id "$publication_run_id" \
                      --arg branch "$head_ref" \
                      --arg publication_sha "$head_sha" \
                      --argjson pull_request_number "$pr_number" \
                      '.repository == $repository
                        and .workflowPath == $workflow_path
                        and .sourceSha == $source_sha
                        and .baseSha == $base_sha
                        and .runId == $run_id
                        and .branch == $branch
                        and .publicationSha == $publication_sha
                        and .pullRequestNumber == $pull_request_number' \
                      "$provenance_dir/publication.json" >/dev/null; then
                      publication_provenance=true
                    fi
                  fi
                fi
              fi
            fi
          fi
          {
            echo "number=$pr_number"
            echo "base_sha=$base_sha"
            echo "base_ref=$base_ref"
            echo "base_repository=$base_repository"
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
            echo "author=$(jq -r '.user.login' <<< "$pr_json")"
            echo "head_repository=$head_repository"
            echo "publication_provenance=$publication_provenance"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull request head as untrusted data
        env:
          DOCS_SYNC_PR_NUMBER: ${{ steps.pr.outputs.number }}
          DOCS_SYNC_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$DOCS_SYNC_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$DOCS_SYNC_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${DOCS_SYNC_PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$DOCS_SYNC_HEAD_SHA"
      - name: Enforce accepted baseline ownership from base-controlled code
        env:
          DOCS_SYNC_ACCEPTED_REVISION: ${{ steps.pr.outputs.base_sha }}
          DOCS_SYNC_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          DOCS_SYNC_BASE_REPOSITORY: ${{ steps.pr.outputs.base_repository }}
          DOCS_SYNC_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          DOCS_SYNC_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          DOCS_SYNC_PR_AUTHOR: ${{ steps.pr.outputs.author }}
          DOCS_SYNC_HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repository }}
          DOCS_SYNC_PUBLICATION_PROVENANCE: ${{ steps.pr.outputs.publication_provenance }}
        run: node tools/docs-sync/src/baseline-guard.mjs .
      - name: Publish ownership status on the pull request head
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_SYNC_PR_NUMBER: ${{ steps.pr.outputs.number }}
          DOCS_SYNC_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SNAPSHOT_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          SNAPSHOT_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if test "$JOB_STATUS" = "success"; then
            current_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${DOCS_SYNC_PR_NUMBER}")
            if jq -e \
              --arg base_sha "$SNAPSHOT_BASE_SHA" \
              --arg head_sha "$SNAPSHOT_HEAD_SHA" \
              '.state == "open" and .base.sha == $base_sha and .head.sha == $head_sha' \
              <<< "$current_pr" >/dev/null; then
              state=success
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${DOCS_SYNC_HEAD_SHA}" \
            -f state="$state" \
            -f context=docs-baseline-ownership \
            -f description="Base-controlled documentation baseline ownership check" \
            -f target_url="$TARGET_URL"

  revalidate-open-publications:
    name: Revalidate open generated publications after main advances
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Invalidate and dispatch every open generated publication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr_number head_sha head_ref author head_repository; do
            test "$author" = "github-actions[bot]" || continue
            test "$head_repository" = "$GITHUB_REPOSITORY" || continue
            [[ "$head_ref" =~ ^docs-sync/[0-9a-f]{40}-[1-9][0-9]*-[0-9a-f]{40}$ ]] || continue
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state=pending \
              -f context=docs-baseline-ownership \
              -f description="Main advanced; exact-base documentation revalidation required" \
              -f target_url="$TARGET_URL"
            gh workflow run docs-baseline-ownership.yml --ref main -f pull_request_number="$pr_number"
            gh workflow run docs-interface-sync.yml --ref "$head_ref" -f pull_request_number="$pr_number"
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | [.number, .head.sha, .head.ref, .user.login, .head.repo.full_name] | @tsv')
