name: refresh-go-storage-deps

on:
  push:
    branches: [reliability/evidence-integrity]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reliability/evidence-integrity
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
      - name: Replace MinIO SDK with standard AWS S3 SDK
        working-directory: services/api
        run: |
          go get github.com/aws/aws-sdk-go-v2/config@latest \
            github.com/aws/aws-sdk-go-v2/credentials@latest \
            github.com/aws/aws-sdk-go-v2/service/s3@latest
          go mod tidy
      - name: Commit reproducible module graph
        run: |
          if git diff --quiet -- services/api/go.mod services/api/go.sum; then
            echo "Go module graph already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/go.mod services/api/go.sum
          git commit -m "deps: replace MinIO SDK with AWS S3 SDK"
          git push origin HEAD:reliability/evidence-integrity
