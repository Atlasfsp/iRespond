name: patch-gateway-wiring
on:
  push:
    branches: [feat/gateway-telemetry]
    paths:
      - services/api/cmd/server/gateway.go
      - services/api/cmd/server/gateway_test.go
      - .github/workflows/patch-gateway-wiring.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gateway-telemetry
      - name: Patch gateway wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('services/api/cmd/server/main.go')
          text = main.read_text()
          old = 'Handler:requestIDMiddleware(mux)'
          if old in text:
              text = text.replace(old, 'Handler:gatewayMiddleware(mux)', 1)
          elif 'Handler:gatewayMiddleware(mux)' not in text:
              raise SystemExit('server handler wiring anchor not found')
          main.write_text(text)

          runtime = Path('services/api/cmd/server/runtime.go')
          text = runtime.read_text()
          anchor = '\t\tfor name, value := range map[string]string{"store": status.Store, "identity": status.Auth, "evidence": status.Evidence, "projects": status.Projects} {'
          if 'gatewayRequestMetrics.writePrometheus(w)' not in text:
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit('runtime metrics anchor not found')
              # insert after dependency loop by locating the loop's closing block immediately before metrics handler closes
              needle = '\t\t\t_, _ = fmt.Fprintf(w, "irespond_runtime_dependency_configured{dependency=%s,implementation=%s} %d\\n", prometheusQuote(name), prometheusQuote(value), configured)\n\t\t}\n\t})'
              replacement = '\t\t\t_, _ = fmt.Fprintf(w, "irespond_runtime_dependency_configured{dependency=%s,implementation=%s} %d\\n", prometheusQuote(name), prometheusQuote(value), configured)\n\t\t}\n\t\tgatewayRequestMetrics.writePrometheus(w)\n\t})'
              if needle not in text:
                  raise SystemExit('runtime metrics insertion point not found')
              text = text.replace(needle, replacement, 1)
          runtime.write_text(text)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/cmd/server/main.go services/api/cmd/server/runtime.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "gateway: wire trust boundary and telemetry into server"
          git push origin HEAD:feat/gateway-telemetry
