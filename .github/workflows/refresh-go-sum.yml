name: refresh-go-sum

on:
  push:
    branches: [chore/ga-supply-chain]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ga-supply-chain
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Generate module checksums
        working-directory: services/api
        run: go mod tidy
      - name: Commit go.sum when changed
        run: |
          if git diff --quiet -- services/api/go.mod services/api/go.sum; then
            echo "Go module metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/go.mod services/api/go.sum
          git commit -m "build: generate Go module checksums"
          git push origin HEAD:chore/ga-supply-chain
