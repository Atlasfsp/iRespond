name: web-verify

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'services/api/cmd/server/**'
      - 'deploy/helm/irespond/**'
      - 'tools/verify_web_frontend.mjs'
      - '.github/workflows/web-verify.yml'

permissions:
  contents: read

jobs:
  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check apps/web/app.js
      - name: Frontend/API boundary contract
        run: node tools/verify_web_frontend.mjs
