name: refresh-security-lock

on:
  push:
    branches: [chore/supply-chain-gate]
    paths:
      - package.json
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/supply-chain-gate
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already current"
            exit 0
          fi
          git commit -m "build: refresh lockfile for security overrides"
          git push origin HEAD:chore/supply-chain-gate
