name: refresh-go-security

on:
  push:
    branches: [chore/supply-chain-gate]
    paths:
      - services/api/go.mod
      - .github/workflows/refresh-go-security.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/supply-chain-gate
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Refresh module graph
        working-directory: services/api
        run: go mod tidy
      - name: Commit Go module metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/go.mod services/api/go.sum
          if git diff --cached --quiet; then
            echo "Go module metadata already current"
            exit 0
          fi
          git commit -m "build: refresh Go metadata for security upgrades"
          git push origin HEAD:chore/supply-chain-gate
