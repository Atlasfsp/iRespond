apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {app.kubernetes.io/name: irespond, app.kubernetes.io/component: api}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.rollout.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels: {app.kubernetes.io/name: irespond, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: irespond, app.kubernetes.io/component: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: {{ .Values.rollout.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        seccompProfile: {type: {{ .Values.podSecurityContext.seccompProfile.type }}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities: {drop: ["ALL"]}
          env:
            - {name: HTTP_ADDR, value: {{ .Values.config.httpAddr | quote }}}
            - {name: OIDC_ISSUER, value: {{ .Values.config.oidcIssuer | quote }}}
            - {name: OIDC_AUDIENCE, value: {{ .Values.config.oidcAudience | quote }}}
            - {name: OIDC_JWKS_URL, value: {{ .Values.config.oidcJwksUrl | quote }}}
            - {name: MAX_REQUEST_BODY_BYTES, value: {{ .Values.config.maxRequestBodyBytes | quote }}}
            - {name: REQUESTS_PER_MINUTE, value: {{ .Values.config.requestsPerMinute | quote }}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secretRefs.database.name }}, key: {{ .Values.secretRefs.database.key }}}}
            - {name: OBJECT_STORAGE_ENDPOINT, value: {{ .Values.objectStorage.endpoint | quote }}}
            - {name: OBJECT_STORAGE_BUCKET, value: {{ .Values.objectStorage.bucket | quote }}}
            - {name: OBJECT_STORAGE_REGION, value: {{ .Values.objectStorage.region | quote }}}
            - {name: OBJECT_STORAGE_SECURE, value: {{ .Values.objectStorage.secure | quote }}}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secretRefs.objectStorageAccessKey.name }}, key: {{ .Values.secretRefs.objectStorageAccessKey.key }}}}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secretRefs.objectStorageSecretKey.name }}, key: {{ .Values.secretRefs.objectStorageSecretKey.key }}}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /livez, port: http}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app.kubernetes.io/name: irespond, app.kubernetes.io/component: api}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
