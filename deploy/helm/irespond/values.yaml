image:
  repository: registry.example.invalid/irespond/api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 30

networkPolicy:
  enabled: true
  allowSameNamespace: true
  additionalIngressNamespaces: []

config:
  httpAddr: ":8080"
  oidcIssuer: ""
  oidcAudience: ""
  oidcJwksUrl: ""
  webAllowedOrigins: ""
  natsSubjectPrefix: "irespond.events"
  maxRequestBodyBytes: "1048576"
  requestsPerMinute: "240"

rollout:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  terminationGracePeriodSeconds: 30
  maxUnavailable: 0
  maxSurge: 1

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 1
  readiness:
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2
  liveness:
    failureThreshold: 3
    periodSeconds: 20
    timeoutSeconds: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

secretRefs:
  database:
    name: irespond-runtime
    key: DATABASE_URL
  nats:
    name: irespond-runtime
    key: NATS_URL
  objectStorageAccessKey:
    name: irespond-runtime
    key: OBJECT_STORAGE_ACCESS_KEY
  objectStorageSecretKey:
    name: irespond-runtime
    key: OBJECT_STORAGE_SECRET_KEY

objectStorage:
  endpoint: ""
  bucket: ""
  region: ""
  secure: true

outbox:
  enabled: true
  replicas: 1
  pollIntervalMs: 1000

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]